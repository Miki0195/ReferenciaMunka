<div class="center-container">
  <mat-card>
    <mat-card-title>Felhasználó létrehozása</mat-card-title>
    <mat-card-content>
      <form [formGroup]="userForm" (ngSubmit)="onSubmit()">

        <div class="form-row">
          <mat-form-field appearance="fill">
            <mat-label>Név</mat-label>
            <input matInput formControlName="name">
            <mat-error *ngIf="userForm.get('name')?.invalid">{{getErrorMessage('name')}}</mat-error>
          </mat-form-field>

          <mat-form-field appearance="fill">
            <mat-label>E-mail cím</mat-label>
            <input matInput formControlName="email" type="email">
            <mat-error *ngIf="userForm.get('email')?.invalid">{{getErrorMessage('email')}}</mat-error>
          </mat-form-field>

          <mat-form-field appearance="fill">
            <mat-label>Jelszó</mat-label>
            <input matInput formControlName="password" type="password">
            <mat-error *ngIf="userForm.get('password')?.invalid">{{getErrorMessage('password')}}</mat-error>
          </mat-form-field>

          <mat-form-field appearance="fill">
            <mat-label>Telefonszám</mat-label>
            <input matInput formControlName="phoneNumber">
            <mat-error *ngIf="userForm.get('phoneNumber')?.invalid">{{getErrorMessage('phoneNumber')}}</mat-error>
          </mat-form-field>

        </div>

          <mat-form-field appearance="fill">
            <mat-label>Számlázási cím</mat-label>
            <input matInput formControlName="address">
            <mat-error *ngIf="userForm.get('address')?.invalid">{{getErrorMessage('address')}}</mat-error>
          </mat-form-field>

        <div class="center-container">
          <button mat-raised-button color="primary" type="submit" [disabled]="userForm.invalid">Létrehozás</button>
        </div>
      </form>
      <div *ngIf="errorMessage" class="alert" role="alert">
        {{errorMessage}}
      </div>
    </mat-card-content>
  </mat-card>
</div>
